<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PCTX Big Picture</title>
<style>
  /* ------------------------------------------------------------------ tokens */
  :root {
    --bg: #0a0e13; --bg-2: #0f141b; --surface: #161d26; --surface-2: #1d2631; --surface-3: #263241;
    --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
    --text: #eef3f8; --text-2: #b8c4d1; --muted: #8796a8;
    --accent: #1a9fff; --accent-2: #66c0ff; --ok: #3fbf5f; --warn: #e0a526; --danger: #f0524a; --fav: #ffc83d;
    --ease: cubic-bezier(.2,.8,.2,1); --ease-in: cubic-bezier(.4,0,1,1);
    --fast: 140ms; --med: 240ms; --slow: 420ms;
    --tile-w: 200px;
    --radius: .55rem;
  }
  /* Everything is sized in rem, and rem follows the window height, so the
     layout reads the same on a laptop and across the room on a TV. */
  html { font-size: clamp(12px, 1.48vh, 26px); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 1rem; line-height: 1.4; -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; position: relative; }
  input { user-select: text; }
  .hidden { display: none !important; }
  svg.i { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Reduced motion: from the OS or our own setting. */
  body.calm *, body.calm *::before, body.calm *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }

  /* ------------------------------------------------------------------ backdrop
     Pre-blurred tiny images (made once in Python) stretched full-screen and
     cross-faded with opacity only -- no CSS blur, so it costs almost nothing. */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  .bd { position: absolute; inset: -6%; background-size: cover; background-position: center; opacity: 0;
    transition: opacity 520ms var(--ease); will-change: opacity, transform; animation: drift 38s ease-in-out infinite alternate; }
  .bd.on { opacity: .62; }
  @keyframes drift { from { transform: scale(1.04) translate3d(-1%, 0, 0); } to { transform: scale(1.12) translate3d(1.5%, -1%, 0); } }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 70% 10%, rgba(10,14,19,.15), rgba(10,14,19,.78) 60%, rgba(10,14,19,.96)),
                linear-gradient(180deg, rgba(10,14,19,.55), rgba(10,14,19,0) 18%, rgba(10,14,19,0) 55%, rgba(10,14,19,.94)); }
  body > header, body > main, body > footer { position: relative; z-index: 1; }

  /* ------------------------------------------------------------------ top bar */
  header { display: flex; align-items: center; gap: 2.2rem; height: 4.8rem; padding: 0 2.6rem; }
  .brand { display: flex; align-items: center; gap: .7rem; font-weight: 700; letter-spacing: .14em; font-size: 1.2rem; }
  .brand svg { width: 2.1rem; height: 2.1rem; }
  nav { position: relative; display: flex; gap: .3rem; align-items: center; }
  .tab { position: relative; display: flex; align-items: center; gap: .5rem; padding: .6rem 1.15rem; border-radius: .45rem; color: var(--muted);
    font-weight: 600; font-size: 1.08rem; cursor: pointer; transition: color var(--fast) var(--ease), background var(--fast) var(--ease); }
  .tab:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .tab.active { color: var(--text); }
  .tab.focus { color: var(--text); background: rgba(255,255,255,.1); box-shadow: 0 0 0 2px #fff; }
  #ink { position: absolute; left: 0; bottom: -.2rem; height: 3px; width: 10px; border-radius: 3px; background: var(--accent);
    box-shadow: 0 0 12px rgba(26,159,255,.7); transition: transform var(--med) var(--ease), width var(--med) var(--ease); }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 1.6rem; color: var(--text-2); font-size: .95rem; }
  #clock { font-weight: 600; font-size: 1.15rem; color: var(--text); font-variant-numeric: tabular-nums; }
  #exitBtn { color: var(--muted); }

  /* ------------------------------------------------------------------ views */
  main { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none;
    transform: translate3d(0, 1.2rem, 0); transition: opacity var(--med) var(--ease), transform var(--med) var(--ease); }
  .view.on { opacity: 1; pointer-events: auto; transform: none; }

  /* ---- library ---- */
  #chips { display: flex; gap: .55rem; padding: .4rem 2.6rem 0; }
  .chip { padding: .42rem 1rem; border-radius: 99px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--text-2);
    font-weight: 600; font-size: .9rem; cursor: pointer; transition: background var(--fast), color var(--fast), border-color var(--fast), box-shadow var(--fast); }
  .chip:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .chip.active { background: var(--text); color: #0b1017; border-color: var(--text); }
  .chip.focus { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff; }
  .chip .n { opacity: .6; margin-left: .35rem; font-variant-numeric: tabular-nums; }

  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #track { position: absolute; left: 0; top: 0; will-change: transform; transition: transform 300ms var(--ease); }
  body.shelf #track { display: flex; align-items: center; gap: 1.6rem; height: 100%; padding: 0 3.4rem; }
  body.grid #track { display: grid; grid-template-columns: repeat(auto-fill, var(--tile-w)); grid-auto-rows: calc(var(--tile-w) * 4 / 3);
    gap: 2rem 1.6rem; justify-content: center; width: 100%; padding: 1.8rem 2.6rem 3rem; }
  #track.instant { transition: none; }
  .empty-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; color: var(--text-2); text-align: center; padding: 2rem; }
  .empty-msg b { font-size: 1.5rem; color: var(--text); }

  .tile { width: var(--tile-w); aspect-ratio: 3 / 4; flex: none; position: relative; border-radius: var(--radius); background: var(--surface);
    cursor: pointer; transform: translate3d(0,0,0) scale(1); transition: transform var(--med) var(--ease), opacity var(--med) var(--ease);
    box-shadow: 0 .6rem 1.6rem rgba(0,0,0,.45); }
  .tile .art { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity var(--slow) var(--ease); }
  .tile img.ok { opacity: 1; }
  .tile .ph { position: absolute; inset: 0; display: flex; align-items: flex-start; padding: 1rem; font-weight: 700; font-size: 1.05rem; line-height: 1.2; color: rgba(255,255,255,.92); }
  .tile .ph::before { content: ""; position: absolute; left: 50%; top: 58%; width: 38%; aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: 2px solid rgba(255,255,255,.22); box-shadow: inset 0 0 0 .9rem rgba(255,255,255,.04); }
  /* Focus ring + glow live on a pseudo-element and only animate opacity. */
  .tile::after { content: ""; position: absolute; inset: -.28rem; border-radius: calc(var(--radius) + .28rem); border: .2rem solid #fff;
    box-shadow: 0 0 2.2rem rgba(102,192,255,.55); opacity: 0; transition: opacity var(--fast) var(--ease); pointer-events: none; }
  .tile .shine { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .tile .shine::before { content: ""; position: absolute; top: -20%; bottom: -20%; width: 45%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent); transform: skewX(-12deg); opacity: 0; }
  .tile.focus { transform: translate3d(0,0,0) scale(1.1); z-index: 3; }
  .tile.focus::after { opacity: 1; }
  .tile.focus .shine::before { animation: shine 900ms var(--ease) 80ms 1; }
  @keyframes shine { 0% { left: -60%; opacity: 1; } 100% { left: 125%; opacity: 0; } }
  .tile.focus.away::after { opacity: .45; box-shadow: none; }
  .tile:not(.focus):hover { transform: translate3d(0,0,0) scale(1.03); }
  .tile .fav { position: absolute; top: .5rem; right: .5rem; color: var(--fav); filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
  .tile .fav svg { width: 1.3rem; height: 1.3rem; fill: currentColor; stroke: none; }
  .tile .dots { position: absolute; left: .55rem; bottom: .55rem; display: flex; gap: .3rem; }
  .tile .dots span { font-size: .66rem; font-weight: 800; letter-spacing: .05em; padding: .12rem .38rem; border-radius: .25rem; background: rgba(10,14,19,.82); color: #c8f5d3; border: 1px solid rgba(63,191,95,.6); }
  .tile.act { background: rgba(255,255,255,.03); border: 2px dashed var(--line-2); box-shadow: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem; color: var(--text-2); }
  .tile.act svg { width: 2.6rem; height: 2.6rem; }
  .tile.act .lbl { font-weight: 600; font-size: 1.05rem; }
  .tile.act.focus { border-color: transparent; color: var(--text); background: rgba(255,255,255,.07); }

  /* ---- hero ---- */
  #hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.2rem 2.4rem; padding: 0 3rem 1.6rem; min-height: 10.5rem; flex-wrap: wrap; }
  #heroText { min-width: 0; flex: 1 1 26rem; }
  #heroText.swap { animation: heroIn var(--med) var(--ease); }
  @keyframes heroIn { from { opacity: 0; transform: translate3d(0, .5rem, 0); } to { opacity: 1; transform: none; } }
  #title { margin: 0; font-size: 2.6rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.12; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 2px 18px rgba(0,0,0,.5); }
  #meta { color: var(--text-2); margin-top: .35rem; font-size: 1rem; }
  #badges { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
  .pill { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .75rem .3rem .6rem; border-radius: 99px; font-size: .86rem; font-weight: 600;
    background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: #d7f7df; background: rgba(63,191,95,.16); border-color: rgba(63,191,95,.45); }
  .pill.star { color: #ffe39a; background: rgba(255,200,61,.14); border-color: rgba(255,200,61,.45); }
  .pill svg { width: 1rem; height: 1rem; }
  #actions { display: flex; gap: .8rem; flex: none; }
  .btn { display: inline-flex; align-items: center; gap: .55rem; padding: .85rem 1.7rem; border-radius: .5rem; background: rgba(255,255,255,.08); border: 1px solid var(--line-2);
    color: var(--text); font-weight: 600; font-size: 1.05rem; cursor: pointer; white-space: nowrap;
    transition: background var(--fast) var(--ease), transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease); }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn.primary { background: linear-gradient(180deg, #47c95f, #2f9e46); border-color: #3cb653; color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.icon { padding: .85rem 1rem; }
  .btn.focus { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #fff, 0 .4rem 1.4rem rgba(0,0,0,.4); transform: translate3d(0,-1px,0); }
  .btn.press, .row.press, .tile.press { transform: scale(.96) !important; }

  /* ---- library welcome ---- */
  #welcome { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .welcome-card { text-align: center; max-width: 40rem; padding: 2rem; }
  .welcome-card h1 { font-size: 2.4rem; margin: 0 0 .6rem; }
  .welcome-card p { color: var(--text-2); margin: 0 0 1.8rem; font-size: 1.1rem; }
  .welcome-card .btns { display: flex; gap: 1rem; justify-content: center; }

  /* ---- settings ---- */
  #settings { flex-direction: row; gap: 2rem; padding: 1rem 2.6rem 1.4rem; }
  #cats { width: 17rem; flex: none; display: flex; flex-direction: column; gap: .3rem; padding-top: 3.6rem; }
  .cat { display: flex; align-items: center; gap: .8rem; padding: .8rem 1rem; border-radius: .5rem; color: var(--text-2); font-weight: 600; font-size: 1.08rem; cursor: pointer;
    transition: background var(--fast), color var(--fast); position: relative; }
  .cat:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .cat.active { color: var(--text); background: rgba(255,255,255,.07); }
  .cat.active::before { content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px; border-radius: 3px; background: var(--accent); }
  .cat.focus { box-shadow: 0 0 0 2px #fff; background: rgba(255,255,255,.1); color: var(--text); }
  #pane { flex: 1; min-width: 0; max-width: 60rem; position: relative; }

  /* ---- shared list (settings pane + modal sheets) ---- */
  .list { height: 100%; overflow-y: auto; padding: 0 .6rem 2rem; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; scroll-behavior: smooth; }
  .list.swap { animation: heroIn var(--med) var(--ease); }
  .list h2 { margin: .6rem 0 .2rem; font-size: 2rem; font-weight: 700; }
  .list .sub { color: var(--text-2); margin-bottom: 1rem; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 1rem; min-height: 3.6rem; padding: .7rem 1.15rem; margin: .35rem 0; border-radius: .55rem;
    background: rgba(22,29,38,.86); border: 1px solid var(--line); cursor: pointer; position: relative;
    transition: background var(--fast) var(--ease), box-shadow var(--fast) var(--ease), transform var(--fast) var(--ease); }
  .row:hover { background: rgba(38,50,65,.9); }
  .row.focus { background: rgba(38,50,65,.96); box-shadow: 0 0 0 2px #fff, 0 .4rem 1.2rem rgba(0,0,0,.35); }
  .row.disabled { opacity: .42; cursor: default; }
  .row .grow { flex: 1; min-width: 0; }
  .row .lab { font-weight: 600; font-size: 1.02rem; }
  .row .desc { color: var(--muted); font-size: .86rem; margin-top: .15rem; white-space: pre-line; }
  .row .val { color: var(--text-2); max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: right; }
  .row.primary { background: linear-gradient(180deg, #47c95f, #2f9e46); border-color: #3cb653; justify-content: center; font-weight: 700; }
  .row.danger { background: linear-gradient(180deg, #e2574f, #b83a33); border-color: #d04a42; justify-content: center; font-weight: 700; }
  .row.center { justify-content: center; font-weight: 600; }
  .row.head { background: none; border: none; cursor: default; min-height: 0; padding: 1.4rem .2rem .2rem; margin: 0; color: var(--muted);
    font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .row.info { background: none; border: none; cursor: default; min-height: 0; padding: .4rem .2rem; color: var(--text-2); white-space: pre-line; }
  .row.info.ok { color: #7fe39a; } .row.info.warn { color: #f2c35b; } .row.info.err { color: #ff8a84; }
  .sw { width: 2.9rem; height: 1.65rem; border-radius: 1rem; background: #3a4757; position: relative; flex: none; transition: background var(--fast) var(--ease); }
  .sw::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.25rem; height: 1.25rem; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: transform var(--med) var(--ease); }
  .sw.on { background: var(--ok); } .sw.on::after { transform: translateX(1.25rem); }
  .cb { width: 1.5rem; height: 1.5rem; border-radius: .35rem; border: 2px solid #607086; flex: none; display: flex; align-items: center; justify-content: center; color: #fff;
    transition: background var(--fast), border-color var(--fast); }
  .cb svg { width: 1rem; height: 1rem; stroke-width: 3; }
  .cb.on { background: var(--accent); border-color: var(--accent); }
  .cb.radio { border-radius: 50%; } .cb.radio.on { background: var(--bg); box-shadow: inset 0 0 0 .32rem var(--accent); border-color: var(--accent); }
  .slider { display: flex; align-items: center; gap: .9rem; flex: none; width: 15rem; }
  .slider .bar { flex: 1; height: .38rem; border-radius: 1rem; background: #3a4757; position: relative; overflow: hidden; }
  .slider .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: inherit; transition: width var(--fast) var(--ease); }
  .slider .num { width: 3.2rem; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .choice { display: flex; align-items: center; gap: .6rem; color: var(--text); font-weight: 600; }
  .choice .arr { color: var(--muted); }
  .row.focus .choice .arr { color: var(--text); }
  .row input[type=text] { flex: 1; background: rgba(0,0,0,.3); border: 1px solid var(--line-2); border-radius: .4rem; color: var(--text); font: inherit; padding: .55rem .75rem; outline: none; }
  .row input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,159,255,.25); }
  .spin { display: inline-block; width: 1.1rem; height: 1.1rem; border: 2px solid rgba(255,255,255,.18); border-top-color: var(--accent-2); border-radius: 50%;
    animation: sp .8s linear infinite; vertical-align: -.2rem; margin-right: .6rem; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- modal ---- */
  #modal { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(4,7,10,.74);
    opacity: 0; pointer-events: none; transition: opacity var(--med) var(--ease); }
  #modal.on { opacity: 1; pointer-events: auto; }
  .card { width: min(56rem, 92vw); height: min(48rem, 84vh); background: linear-gradient(180deg, #18202a, #121820); border: 1px solid var(--line-2);
    border-radius: 1rem; padding: 1.4rem 1.2rem 0; box-shadow: 0 2rem 5rem rgba(0,0,0,.6); transform: translate3d(0, 1rem, 0) scale(.97);
    transition: transform var(--med) var(--ease); display: flex; flex-direction: column; }
  .card.small { height: auto; max-height: 84vh; width: min(40rem, 92vw); padding-bottom: 1rem; }
  #modal.on .card { transform: none; }

  /* ---- launch overlay / splash ---- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem;
    background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 360ms var(--ease); }
  .overlay.on { opacity: 1; pointer-events: auto; }
  #splash svg { width: 7rem; height: 7rem; animation: pop 700ms var(--ease) both; }
  #splash .word { font-weight: 700; letter-spacing: .5em; font-size: 1.4rem; margin-left: .5em; animation: rise 700ms var(--ease) 120ms both; }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
  #launch { background: rgba(6,9,12,.9); }
  #launch img, #launch .lph { width: 14rem; aspect-ratio: 3/4; object-fit: cover; border-radius: .7rem; box-shadow: 0 1.4rem 4rem rgba(0,0,0,.7); }
  #launch.on img, #launch.on .lph { animation: pop 520ms var(--ease) both; }
  #launch .t { font-size: 1.6rem; font-weight: 700; }
  #launch .s { color: var(--text-2); }

  /* ---- prompt bar ---- */
  footer { display: flex; align-items: center; gap: .5rem 2rem; padding: 0 2.6rem; height: 3.4rem; background: rgba(6,9,12,.86); border-top: 1px solid var(--line); color: var(--text-2); font-size: .92rem; }
  footer .grow { flex: 1; }
  .hint { display: inline-flex; align-items: center; gap: .5rem; white-space: nowrap; animation: heroIn var(--fast) var(--ease); }
  .key { display: inline-flex; align-items: center; justify-content: center; min-width: 1.6rem; height: 1.6rem; padding: 0 .4rem; border-radius: .3rem; font-size: .78rem; font-weight: 700;
    color: var(--text); background: #222c38; border: 1px solid #3b4a5c; border-bottom-width: 2px; }
  .key.mouse { border-radius: 1rem; padding: 0 .6rem; }
  .pad { display: inline-flex; align-items: center; justify-content: center; min-width: 1.65rem; height: 1.65rem; padding: 0 .3rem; border-radius: 50%; font-size: .82rem; font-weight: 800; color: #fff; background: #4a5a6e; }
  .pad.xbox.bottom, .pad.gamepad.bottom { background: #3a9a3f; } .pad.xbox.right, .pad.gamepad.right { background: #c8372f; }
  .pad.xbox.left, .pad.gamepad.left { background: #2f6fd0; }   .pad.xbox.top, .pad.gamepad.top { background: #c09a1e; }
  .pad.playstation { background: #262d3a; font-size: 1rem; }
  .pad.playstation.bottom { color: #7ab8ff; } .pad.playstation.right { color: #ff7a7a; }
  .pad.playstation.left { color: #f394dc; }   .pad.playstation.top { color: #4fd8ac; }
  .pad.nintendo { background: #5b6472; }
  .pad.wide { border-radius: .35rem; padding: 0 .5rem; font-size: .74rem; background: #3c4a5c; }
  .dpad { width: 1.55rem; height: 1.55rem; position: relative; display: inline-block; }
  .dpad::before, .dpad::after { content: ""; position: absolute; background: #6b7d93; border-radius: 2px; }
  .dpad::before { left: 0; top: 34%; width: 100%; height: 32%; } .dpad::after { left: 34%; top: 0; width: 32%; height: 100%; }

  /* ---- toasts ---- */
  #toasts { position: fixed; left: 50%; top: 5.4rem; transform: translateX(-50%); z-index: 12; display: flex; flex-direction: column; align-items: center; gap: .5rem; pointer-events: none; }
  .toast { display: flex; align-items: flex-start; gap: .7rem; max-width: min(46rem, 80vw); padding: .8rem 1.2rem; border-radius: .6rem; white-space: pre-line;
    background: rgba(18,24,32,.97); border: 1px solid var(--line-2); box-shadow: 0 1rem 2.6rem rgba(0,0,0,.5); font-size: .98rem;

const FOCUSABLE = ['button', 'toggle', 'slider', 'choice', 'check', 'radio', 'field'];

      case 'choice': return `<div class="row${f}${d}" data-r="${i}">${lab}<div class="choice"><span class="arr">‹</span>${esc(r.options.find((o) => o.v === r.value)?.l ?? r.value)}<span class="arr">›</span></div></div>`;

    { t: 'button', key: 'add', label: 'Add game', cls: 'primary', act: async () => {

        if (r.error) { sfx.play('error'); list.set(build(r.error), { keep: true }); }
        else { closeModal(true); sfx.play('success'); toast('Game added.', 'ok'); }
      } },
    { t: 'button', key: 'cancel', label: 'Cancel', cls: 'center', act: () => closeModal() }];
  const list = openModal({ small: true, title: 'Add a game', sub: 'Type the disc serial printed on the case or disc.', rows: build('') });
  list.form = form;
}
function openConfirmRemove(it) {
  openModal({ small: true, title: `Remove ${it.title}?`, sub: 'This only removes it from your PCTX library. Anything installed in PCSX2 stays.', rows: [
    { t: 'button', key: 'no', label: 'Keep it', cls: 'center', act: () => closeModal() },
    { t: 'button', key: 'yes', label: 'Remove from library', cls: 'danger', act: async () => { await rpc('game.remove', { serial: it.serial }); closeModal(true); sfx.play('back'); toast('Removed from your library.', 'ok'); } }] });
}

// ======================================================================= enhancements
// One screen for everything that makes a game better in PCSX2: patches & fixes,
// cheats and texture packs -- what's available, what's installed, what's on --
// plus a one-press Recommended preset and checks for anything that would stop
// them from working. Nothing changes until "Apply".
const KIND_ICON = { widescreen: 'grid', nointerlace: 'grid', fix: 'check', fps: 'play', quality: 'star', other: 'info' };
async function openEnhancements(it) {
  const list = openModal({ title: it.title, sub: it.serial, rows: [{ t: 'info', label: 'Looking up patches, cheats and texture packs…', spin: true }] });
  const o = await rpc('install.prepare', { serial: it.serial });
  if (modalList !== list) return;
  if (o.error) { sfx.play('error'); list.set([{ t: 'info', label: o.error, kind: 'err' }, { t: 'button', key: 'ok', label: 'Close', cls: 'center', act: () => closeModal() }]); return; }

  // ---- state: what will be on after Apply ----
  const st = { patches: {}, cheats: new Set(), texture: -1, cheatsOverwrite: false, texturesOverwrite: false, remove: new Set(), fixes: new Set() };
  const nothingInstalled = !o.cheatsInstalled && !o.texturesInstalled && !o.patches.some((p) => p.installed);
  const useCurrent = () => {
    o.patches.forEach((p, i) => { st.patches[i] = new Set(p.groups.filter((g) => g.enabled).map((g) => g.name)); if (p.always && p.installed) st.patches[i].add('*'); });
    o.cheats.forEach((c, i) => { if (c.enabled) st.cheats.add(i); });
  };
  const useRecommended = () => {
    o.patches.forEach((p, i) => { st.patches[i] = new Set(o.recommended.patches[String(i)] || []); if (p.always && (String(i) in o.recommended.patches || p.exact)) st.patches[i].add('*'); });
    st.texture = o.recommended.texture;
  };
  useCurrent();
  if (nothingInstalled && o.recommended.summary.length) useRecommended();
  o.checks.forEach((c) => { if (c.fix) st.fixes.add(c.fix); });

  const crcNote = o.crc ? `CRC ${o.crc} · ${o.crcSource === 'disc' ? 'read from your disc' : 'from ' + (o.crcSource || 'a database')}` : 'CRC unknown';
  const build = () => {
    const rows = [];
    // recommended
    if (o.recommended.summary.length) {
      rows.push({ t: 'info', label: 'Recommended: ' + o.recommended.summary.join('; '), kind: 'ok' });
      rows.push({ t: 'button', key: 'rec', label: 'Use recommended', icon: 'star', cls: 'center', sound: 'toggle', act: () => { useRecommended(); list.set(build(), { keep: true }); } });
    }
    // checks that need attention
    o.checks.filter((c) => c.level === 'warn' || c.level === 'error').forEach((c) => {
      rows.push({ t: 'info', label: c.text, kind: 'warn' });
      if (c.fix) rows.push({ t: 'toggle', key: 'fix-' + c.fix, label: c.fixLabel, desc: 'Changes this in PCSX2’s settings', on: st.fixes.has(c.fix),
        set: (on) => { on ? st.fixes.add(c.fix) : st.fixes.delete(c.fix); } });
    });

    // patches & fixes
    rows.push({ t: 'head', label: 'Patches & fixes' });
    if (!o.patches.length) rows.push({ t: 'info', label: "PCSX2's patch collection has nothing for this game. It may simply not need any." });
    o.patches.forEach((p, i) => {
      if (o.patches.length > 1 || p.update) rows.push({ t: 'info', label: p.label + (p.update ? '  ·  update available: apply to get it' : p.installed ? '  ·  installed' : ''), kind: p.update ? 'warn' : '' });
      if (p.always) rows.push({ t: 'toggle', key: `p${i}*`, label: 'Always-on fixes', desc: 'Applied whenever this patch file is installed', on: st.patches[i].has('*'),
        set: (on) => { on ? st.patches[i].add('*') : st.patches[i].delete('*'); } });
      p.groups.forEach((g) => rows.push({ t: 'toggle', key: `p${i}:${g.name}`, label: g.name,
        desc: [g.kindLabel + (g.recommended ? ' · recommended' : ''), g.description].filter(Boolean).join(' — '),
        on: st.patches[i].has(g.name), set: (on) => { on ? st.patches[i].add(g.name) : st.patches[i].delete(g.name); } }));
    });
    if (o.patches.some((p) => p.installed)) rows.push({ t: 'toggle', key: 'rm-p', label: 'Remove installed patch files', on: st.remove.has('patches'),
      set: (on) => { on ? st.remove.add('patches') : st.remove.delete('patches'); } });

    // cheats
    rows.push({ t: 'head', label: 'Cheats' });
    if (!o.cheats.length) rows.push({ t: 'info', label: 'No cheats were found for this game in any source.' });
    else rows.push({ t: 'button', key: 'cheats', label: 'Choose cheats', icon: 'check', desc: `${o.cheats.length} found ${o.cheatNote}`,
      value: st.cheats.size ? `${st.cheats.size} on` : 'none on', act: () => openCheatPicker(o, st, () => list.set(build(), { keep: true })) });
    if (o.cheatsForeign) rows.push({ t: 'toggle', key: 'cow', label: 'Replace my existing cheat file', desc: "It wasn't made by PCTX", on: st.cheatsOverwrite, set: (on) => { st.cheatsOverwrite = on; } });
    if (o.cheatsInstalled) rows.push({ t: 'toggle', key: 'rm-c', label: 'Remove the cheat file', on: st.remove.has('cheats'), set: (on) => { on ? st.remove.add('cheats') : st.remove.delete('cheats'); } });

    // textures
    rows.push({ t: 'head', label: 'Texture pack' + (o.texturesInstalled ? ' · one is installed' : '') });
    rows.push({ t: 'radio', key: 't-1', group: 'tex', i: -1, label: o.texturesInstalled ? 'Keep the installed pack' : "Don't install a texture pack", on: st.texture === -1, set: () => { st.texture = -1; } });
    o.textures.forEach((t, i) => rows.push({ t: 'radio', key: 't' + i, group: 'tex', i, label: t.label, desc: t.confidenceLabel, on: st.texture === i, set: () => { st.texture = i; } }));
    if (!o.textures.length) rows.push({ t: 'info', label: 'No pack found. Turn on "Dump textures while playing" in PCSX2 settings and play a little; PCTX can then AI-upscale the game’s own textures.' });
    if (o.texturesInstalled) {
      rows.push({ t: 'toggle', key: 'tow', label: 'Replace the installed pack with the one above', on: st.texturesOverwrite, set: (on) => { st.texturesOverwrite = on; } });
      rows.push({ t: 'toggle', key: 'rm-t', label: 'Remove the installed pack', on: st.remove.has('textures'), set: (on) => { on ? st.remove.add('textures') : st.remove.delete('textures'); } });
    }

    rows.push({ t: 'head', label: '' });
    rows.push({ t: 'button', key: 'go', label: 'Apply changes', cls: 'primary', act: () => runApply(list, st) });
    rows.push({ t: 'button', key: 'log', label: 'What was searched', cls: 'center', act: () =>
      openModal({ title: 'What was searched', sub: it.title, rows: [{ t: 'info', label: (o.log || []).join('\n') }, { t: 'button', key: 'back', label: 'Back', cls: 'center', act: () => closeModal() }] }) });
    rows.push({ t: 'button', key: 'cancel', label: 'Cancel', cls: 'center', act: () => closeModal() });
    return rows;
  };
  list.set(build(), { sub: `${it.serial}  ·  ${crcNote}`, animate: true });
}

function openCheatPicker(o, st, done) {
  const rows = () => [
    { t: 'button', key: 'all', label: 'All on / all off', cls: 'center', sound: 'toggle', act: () => {
      if (st.cheats.size === o.cheats.length) st.cheats.clear(); else o.cheats.forEach((_c, i) => st.cheats.add(i));
      picker.set(rows(), { keep: true }); } },
    ...o.cheats.map((c, i) => ({ t: 'check', key: 'c' + i, label: c.name, desc: [c.description, c.source].filter(Boolean).join(' · '), on: st.cheats.has(i),
      set: (on) => { on ? st.cheats.add(i) : st.cheats.delete(i); } })),
    { t: 'button', key: 'done', label: 'Done', cls: 'primary', act: () => { closeModal(true); sfx.play('back'); done(); } }];
  const picker = openModal({ title: 'Cheats', sub: 'Every cheat is written to the cheat file; only the ones you tick are switched on.', rows: rows(),
    onBack: () => { closeModal(); done(); } });
}

async function runApply(list, st) {
  const sel = { patches: Object.fromEntries(Object.entries(st.patches).map(([k, v]) => [k, [...v]]).filter(([, v]) => v.length)),
    cheats: [...st.cheats], cheatsOverwrite: st.cheatsOverwrite, texture: st.texture, texturesOverwrite: st.texturesOverwrite,
    remove: [...st.remove], fixes: [...st.fixes] };
  const status = { t: 'info', label: 'Applying…', spin: true };
  list.set([status, { t: 'info', label: 'You can keep browsing; this finishes in the background.' }, { t: 'button', key: 'hide', label: 'Hide', cls: 'center', act: () => closeModal() }]);
  const r = await rpc('install.apply', sel, (line) => { status.label = line; if (modalList === list) list.render(false); });
  const lines = r.results || [r.error || 'Done.'];
  const failed = !!r.error || lines.some((l) => /error|failed|couldn't|can't/i.test(l));
  sfx.play(failed ? 'error' : 'success');
  if (modalList !== list) { toast(lines.join('\n'), failed ? 'err' : 'ok', 6000); return; }
  const out = lines.map((l) => ({ t: 'info', label: l, kind: /error|failed|couldn't|can't/i.test(l) ? 'err' : /installed|switched on|turned on|removed/i.test(l) ? 'ok' : '' }));
  (r.remember || []).forEach((m) => out.push({ t: 'button', key: 'rem' + m.i, label: `Remember ${m.label} for next time`, cls: 'center',
    act: async (row) => { const x = await rpc('texture.remember', { i: m.i }); toast(x.error || 'Saved to your texture sources.', x.error ? 'err' : 'ok'); row.disabled = true; list.render(false); } }));
  out.push({ t: 'button', key: 'ok', label: 'Done', cls: 'primary', act: () => closeModal() });
  list.set(out, { title: failed ? 'Finished with problems' : 'All set', animate: true });
}

// ======================================================================= input routing
function route(name) {
  if (splashOn) return;
  if (modalList) {
    if (name === 'up') return modalList.move(-1);
    if (name === 'down') return modalList.move(1);
    if (name === 'left' || name === 'right') { if (!modalList.adjust(name === 'left' ? -1 : 1)) sfx.play('bump'); return; }
    if (name === 'confirm') return modalList.activate(modalList.idx);
    if (name === 'back') return modalList.onBack ? modalList.onBack() : closeModal();
    return;
  }
  const h = screen === 'settings' ? settingsNav : lib;
  if (h[name]) h[name]();
}
['up', 'down', 'left', 'right', 'confirm', 'back'].forEach((n) => input.on(n, () => route(n)));
input.on('button2', () => { if (!modalList && screen === 'library') { const it = cur(); if (isGame(it) && it.launchable) launch(it); else sfx.play('error'); } });
input.on('button3', () => { if (!modalList && screen === 'library') toggleFavorite(cur()); });
input.on('button4', () => { if (!modalList && screen === 'library' && games.length) setFilter(filterIdx() - 1); });
input.on('button5', () => { if (!modalList && screen === 'library' && games.length) setFilter(filterIdx() + 1); });
input.on('button8', () => { if (!modalList && screen === 'library') toggleMode(); });
input.on('button9', () => { if (!modalList) showScreen(screen === 'settings' ? 'library' : 'settings'); });
input.onModeChange(renderPrompt);

window.addEventListener('keydown', (e) => {
  const k = e.key, typing = document.activeElement && document.activeElement.tagName === 'INPUT';
  if (typing) {
    const inp = document.activeElement;
    if (k === 'Enter' || k === 'ArrowDown' || k === 'Tab') { inp.blur(); if (modalList) modalList.move(1); }
    else if (k === 'Escape') inp.blur();
    else if (k === 'ArrowUp') { inp.blur(); if (modalList) modalList.move(-1); }
    else return;
    e.preventDefault(); return;
  }
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Enter: 'confirm', ' ': 'confirm', Escape: 'back', Backspace: 'back' };
  if (map[k]) { route(map[k]); e.preventDefault(); return; }
  if (modalList || splashOn) return;
  const lower = k.length === 1 ? k.toLowerCase() : k;
  if (screen === 'library') {
    if (lower === 'p') { const it = cur(); if (isGame(it) && it.launchable) launch(it); else sfx.play('error'); }
    else if (lower === 'f') toggleFavorite(cur());
    else if (lower === 'g') toggleMode();
    else if (lower === 'q' && games.length) setFilter(filterIdx() - 1);
    else if (lower === 'e' && games.length) setFilter(filterIdx() + 1);
    else if (k === 'Delete') { const it = cur(); if (isGame(it)) { sfx.play('select'); openConfirmRemove(it); } }
    else if (k === '+' || k === '=') setPref('zoom', clamp(Math.round(((Number(prefs.zoom) || 1) + 0.1) * 10) / 10, 0.7, 1.6));
    else if (k === '-' || k === '_') setPref('zoom', clamp(Math.round(((Number(prefs.zoom) || 1) - 0.1) * 10) / 10, 0.7, 1.6));
    else if (k === 'Tab') showScreen('settings');
    else return;
  } else if (k === 'Tab') showScreen('library');
  else return;
  e.preventDefault();
});
// Mouse: hover highlights, click focuses, a second click (or double click) activates; right-click is Back.
window.addEventListener('contextmenu', (e) => { e.preventDefault(); route('back'); });
$('modalList').addEventListener('input', (e) => { if (e.target.tagName === 'INPUT' && modalList && modalList.form) modalList.form[modalList.rows[Number(e.target.dataset.r)].key] = e.target.value; });
for (const host of [$('modalList'), $('paneList')]) {
  host.addEventListener('click', (e) => {
    const r = e.target.closest('.row'); if (!r || r.dataset.r === undefined || e.target.tagName === 'INPUT') return;
    const list = host === $('modalList') ? modalList : paneList;
    if (!list) return;
    if (list === paneList && zone !== 'rows') { zone = 'rows'; }
    const i = Number(r.dataset.r), row = list.rows[i];
    if (row && row.t === 'slider') {
      const bar = r.querySelector('.bar').getBoundingClientRect();
      if (e.clientX >= bar.left - 8) {
        const v = clamp(Math.round(((e.clientX - bar.left) / bar.width * (row.max - row.min) + row.min) / row.step) * row.step, row.min, row.max);
        row.value = Math.round(v * 1000) / 1000; list.idx = i; list.render(false); if (row.set) row.set(row.value); sfx.play('move'); refreshFocus(); return;
      }
    }
    list.activate(i); refreshFocus();
  });
}
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });
$('track').addEventListener('click', (e) => {
  const t = e.target.closest('.tile'); if (!t) return;
  const i = Number(t.dataset.i);
  if (zone !== 'shelf') { zone = 'shelf'; refreshFocus(); }
  if (i === idx) lib.confirm(); else setIdx(i);
});
$('track').addEventListener('dblclick', (e) => { const t = e.target.closest('.tile'); if (t && Number(t.dataset.i) === idx && isGame(cur())) { const it = cur(); it.launchable ? launch(it) : null; } });
let wheelAt = 0;
$('stage').addEventListener('wheel', (e) => {
  e.preventDefault();
  if (mode === 'grid') { gridY += e.deltaY; placeTrack(false); return; }
  const now = performance.now(); if (now - wheelAt < 70) return; wheelAt = now;
  if (zone !== 'shelf') { zone = 'shelf'; refreshFocus(); }
  setIdx(idx + ((e.deltaY || e.deltaX) > 0 ? 1 : -1));
}, { passive: false });
$('nav').addEventListener('click', (e) => { const n = e.target.closest('.tab'); if (!n) return; navIdx = Number(n.dataset.n); navConfirm(); });
$('chips').addEventListener('click', (e) => { const c = e.target.closest('.chip'); if (!c) return; setFilter(Number(c.dataset.f)); });
$('actions').addEventListener('click', (e) => { const b = e.target.closest('.btn'); if (!b) return; actIdx = Number(b.dataset.a); zone = 'actions'; refreshFocus(); lib.confirm(); });
$('welcomeBtns').addEventListener('click', (e) => { const b = e.target.closest('.btn'); if (!b) return; actIdx = Number(b.dataset.w); zone = 'welcome'; lib.confirm(); });
$('cats').addEventListener('click', (e) => { const c = e.target.closest('.cat'); if (!c) return; catIdx = Number(c.dataset.c); zone = 'cats'; sfx.play('move'); renderCats(); loadCategory(true); renderPrompt(); });

// ======================================================================= button hints
// The bar describes the device used last (keyboard keys, mouse, or the real
// face-button labels of the controller in hand) and only lists what works here.
function renderPrompt() {
  const dev = input.device, pad = input.isPad, L = input.labels;
  const K = (t) => `<span class="key">${t}</span>`;
  const M = (t) => `<span class="key mouse">${t}</span>`;
  const P = (pos) => `<span class="pad ${dev} ${pos}">${L[pos]}</span>`;
  const W = (name) => `<span class="pad wide">${L[name]}</span>`;
  const hint = (icon, text) => `<span class="hint">${icon}<span>${text}</span></span>`;
  const left = [], right = [];
  const row = modalList ? modalList.current() : (screen === 'settings' && zone === 'rows' ? paneList.current() : null);
  const adjustable = row && (row.t === 'slider' || row.t === 'choice');
  const it = cur(), game = !modalList && screen === 'library' && zone === 'shelf' && isGame(it);
  const confirmLabel = modalList ? 'Choose' : zone === 'nav' ? 'Open' : row && (row.t === 'toggle' || row.t === 'check') ? 'Toggle'
    : screen === 'library' && zone === 'shelf' && isGame(it) ? (it.launchable ? 'Options' : 'Enhancements') : 'Select';
  const backLabel = modalList ? 'Close' : screen === 'library' && (zone === 'shelf' || zone === 'welcome' || !games.length) ? 'Exit' : 'Back';

  if (pad) {
    left.push(hint('<span class="dpad"></span>', adjustable ? 'Move / Adjust' : 'Move'));
    right.push(hint(P('bottom'), confirmLabel), hint(P('right'), backLabel));
    if (game) {
      if (it.launchable) right.unshift(hint(P('left'), 'Play'));
      right.unshift(hint(P('top'), it.favorite ? 'Unfavorite' : 'Favorite'));
    }
    if (!modalList && screen === 'library' && games.length) left.push(hint(`<span class="pad wide">${L.lb}</span><span class="pad wide">${L.rb}</span>`, 'Filter'), hint(W('view'), mode === 'grid' ? 'Shelf' : 'Grid'));
    if (!modalList) left.push(hint(W('menu'), screen === 'settings' ? 'Library' : 'Settings'));
  } else if (dev === 'mouse') {
    left.push(hint(M('Click'), 'Select'), hint(M('Scroll'), 'Browse'), hint(M('Right-click'), backLabel));
    if (game && it.launchable) left.push(hint(M('Double-click'), 'Play'));
  } else {
    left.push(hint(K('←') + K('↑') + K('↓') + K('→'), adjustable ? 'Move / Adjust' : 'Move'));
    if (!modalList && screen === 'library' && games.length) left.push(hint(K('Q') + K('E'), 'Filter'), hint(K('G'), mode === 'grid' ? 'Shelf' : 'Grid'));
    if (!modalList) left.push(hint(K('Tab'), screen === 'settings' ? 'Library' : 'Settings'));
    right.push(hint(K('Enter'), confirmLabel), hint(K('Esc'), backLabel));
    if (game) { if (it.launchable) right.unshift(hint(K('P'), 'Play')); right.unshift(hint(K('F'), it.favorite ? 'Unfavorite' : 'Favorite')); }
  }
  $('prompt').innerHTML = left.join('') + '<span class="grow"></span>' + right.join('');
}

// ======================================================================= Python -> page
window.setGames = function (list) {
  const keep = isGame(cur()) ? cur().serial : null;
  const first = !games.length;
  games = list || [];
  heroFor = null;
  renderTiles(keep);
  if (first && games.length && screen === 'library' && (zone === 'welcome' || zone === 'chips')) { zone = 'shelf'; refreshFocus(); }
  if (screen === 'settings' && CATS[catIdx].id === 'library') loadCategory(false);
  notifySelection();
};
function patchGame(serial, fn) {
  const g = games.find((x) => x.serial === serial); if (!g) return;
  fn(g);
  const i = items.indexOf(g);
  if (i >= 0) { const el = $('track').children[i]; if (el) { el.outerHTML = tileHTML(g, i); if (i === idx) { focusedEl = null; focusTile(true); } } }
  if (g === cur()) { heroFor = null; scheduleHero(); }
}
window.updateGameStatus = (serial, cheats, textures) => patchGame(serial, (g) => { g.cheats = cheats; g.textures = textures; });
window.updateGameCover = (serial, url) => patchGame(serial, (g) => { g.cover = url; });
window.updateGameBackdrop = (serial, url) => { const g = games.find((x) => x.serial === serial); if (g) { g.backdrop = url; if (g === cur()) { bdFor = null; setBackdrop(g); } } };
window.selectGameSerial = function (serial) { const i = items.findIndex((g) => g.serial === serial); if (i >= 0 && i !== idx) { idx = i; focusTile(true); } };
window.showToast = function (msg) { toast(msg, /error|fail|couldn't|can't/i.test(msg) ? 'err' : 'info', 6000); };
window.bpEnter = function () {
  // Played each time Big Picture opens: a quick fade-in and the chime.
  document.body.style.opacity = '0';
  requestAnimationFrame(() => { document.body.style.transition = 'opacity 380ms cubic-bezier(.2,.8,.2,1)'; document.body.style.opacity = '1'; });
  sfx.play('boot');
  settingsCache = null;
};

// ======================================================================= boot
let splashOn = true;
renderNav();
applyZoom();
renderTiles();
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
tick(); setInterval(tick, 10000);
rpc('prefs.get').then((p) => {
  if (p && !p.error) Object.assign(prefs, p);
  applyPrefs(); renderTiles(isGame(cur()) ? cur().serial : null);
});
setTimeout(() => { $('splash').classList.remove('on'); splashOn = false; sfx.play('boot'); renderPrompt(); }, 900);
window.__bp = { state: () => ({ idx, zone, screen, mode, n: items.length, games: games.length, filter: prefs.filter, modal: modalList ? modalList.title : null, device: input.device, cat: CATS[catIdx].id }), items: () => items };
</script>
