<svg width="790" height="280" viewBox="0 0 790 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBgGrad" x1="0" y1="0" x2="790" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#04080F"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121F33"/>
      <stop offset="50%" stop-color="#0B1422"/>
      <stop offset="100%" stop-color="#060A11"/>
    </linearGradient>
    <linearGradient id="badgeBorder" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67D5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="300" y1="80" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E1F4FF"/>
      <stop offset="100%" stop-color="#A5DEFF"/>
    </linearGradient>
    <linearGradient id="pGradLogo" x1="100" y1="90" x2="220" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9F2FF"/>
    </linearGradient>
    <linearGradient id="cyanBeamLogo" x1="150" y1="100" x2="230" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7BE4FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="blueBeamLogo" x1="150" y1="170" x2="230" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Card -->
  <rect width="790" height="280" rx="28" fill="url(#logoBgGrad)"/>
  <rect x="1" y="1" width="788" height="278" rx="27" stroke="#1E293B" stroke-width="2"/>

  <!-- Emblem (same mark as the app icon) -->
  <g transform="translate(70, 40)">
    <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="6"/>
    <rect x="4" y="4" width="192" height="192" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.5"/>
    <g transform="translate(2, -4) scale(0.44)">
      <path d="M152 130V382H216V298H244C298 298 334 266 334 214C334 162 298 130 244 130H152Z" fill="url(#pGradLogo)"/>
      <path d="M216 182H240C268 182 284 195 284 214C284 233 268 246 240 246H216V182Z" fill="#0B1422"/>
      <path d="M242 152L346 256" stroke="url(#cyanBeamLogo)" stroke-width="24" stroke-linecap="round"/>
      <path d="M346 152L242 256" stroke="url(#cyanBeamLogo)" stroke-width="24" stroke-linecap="round"/>
      <path d="M256 276L346 366" stroke="url(#blueBeamLogo)" stroke-width="20" stroke-linecap="round"/>
      <path d="M346 276L256 366" stroke="url(#blueBeamLogo)" stroke-width="20" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Name -->
  <text x="318" y="183" fill="url(#titleGrad)" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="150" font-weight="900" letter-spacing="-2">PCTX</text>
</svg>
