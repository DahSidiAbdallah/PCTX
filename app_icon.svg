<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121F33"/>
      <stop offset="50%" stop-color="#0B1422"/>
      <stop offset="100%" stop-color="#060A11"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67D5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="140" y1="120" x2="340" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9F2FF"/>
    </linearGradient>
    <linearGradient id="cyanBeam" x1="220" y1="140" x2="350" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7BE4FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="blueBeam" x1="230" y1="260" x2="350" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle Badge -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>
  
  <!-- Subtle Internal Rim Accent -->
  <rect x="44" y="44" width="424" height="424" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- P Emblem Core -->
  <g id="monogram">
    <!-- Outer P Spine & Loop -->
    <path d="M152 130V382H216V298H244C298 298 334 266 334 214C334 162 298 130 244 130H152Z" fill="url(#pGrad)"/>
    <!-- Inner P Cutout -->
    <path d="M216 182H240C268 182 284 195 284 214C284 233 268 246 240 246H216V182Z" fill="#0B1422"/>
    
    <!-- Dynamic 'X' Crossing Beams (Upper Cyan & Lower Blue) -->
    <path d="M242 152L346 256" stroke="url(#cyanBeam)" stroke-width="22" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <path d="M346 152L242 256" stroke="url(#cyanBeam)" stroke-width="22" stroke-linecap="round" filter="url(#subtleGlow)"/>
    
    <!-- Lower PS2 Accent Wing -->
    <path d="M256 276L346 366" stroke="url(#blueBeam)" stroke-width="18" stroke-linecap="round"/>
    <path d="M346 276L256 366" stroke="url(#blueBeam)" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
